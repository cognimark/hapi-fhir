name: Cognimark storage compatibility

on:
  push:
    branches: [cognimark/8.12.1-long-resource-ids]
  pull_request:
    branches: [cognimark/8.12.1-long-resource-ids]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: docker.io/library/maven:3.9.12-eclipse-temurin-17@sha256:a0603aab698040d9c94259f379ec0487da1678560748d6c7508483034033c53d
    defaults:
      run:
        working-directory: .cognimark-hapi-core
    steps:
      - uses: actions/checkout@v4
        with:
          # Match the starter's container-owned checkout; retain Git's ownership checks.
          path: .cognimark-hapi-core
      - name: Verify the production builder toolchain
        run: mvn --version
      - name: Build the source-preserving parser and test narrative round trips
        env:
          MAVEN_OPTS: -Xmx2g -XX:ActiveProcessorCount=2
        run: |
          mvn -B -ntp -f hapi-fhir-base/pom.xml install
          mvn -B -ntp -f cognimark/narrative-tests/pom.xml test
      - name: Build the versioned storage, reindex and recovery libraries
        env:
          MAVEN_OPTS: -Xmx2g -XX:ActiveProcessorCount=2
        run: |
          mvn -B -ntp -f hapi-fhir-jpaserver-model/pom.xml -Dtest=ResourceTableTest install
          mvn -B -ntp -f hapi-fhir-jpaserver-searchparam/pom.xml install
          mvn -B -ntp -f hapi-fhir-storage/pom.xml -Dtest=BaseStorageDaoResourceIdTest,DaoResourceLinkResolverTest install
          mvn -B -ntp -f hapi-fhir-jpa/pom.xml install
          mvn -B -ntp -f hapi-fhir-storage-batch2/pom.xml install
          mvn -B -ntp -f cognimark/batch2-tests/pom.xml test
          mvn -B -ntp -f hapi-fhir-storage-batch2-jobs/pom.xml install
          mvn -B -ntp -f hapi-fhir-jpaserver-base/pom.xml \
            -Dtest=LocalBatch2WorkRecoveryTest,ReindexPartitionContextTest,JpaJobPersistenceImplTest,ReindexReferencePrefetchTest install
          mvn -B -ntp -f cognimark/reindex-tests/pom.xml test
